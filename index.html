<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/style.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>

            <!-- form div -->
         <div class="left-side">
            <form id="loginForm">
                <h2>Get Started Now</h2>
                <!-- div container for the inputs -->

                <div class="input-div">
                <label for="name">Name</label>
                <input type="text" placeholder="Joe">

                <label for="email">Email address</label>
                <input type="email" placeholder="hello@gmail.com">

                <label for="password">Password</label>
                <input type="password" placeholder="Password">
                </div>

                <input type="checkbox"><label for="checkbox" class="terms">I agree to <a href="#" class="terms-box">terms & policy</a></label>

                <button type="submit" id="signup">Signup</button>


                <!-- the div class for the or and other sigin options -->

                <div class="or-line">
                    <!-- the div for the or  -->

                    <div class="or">
                        <p><hr>or<hr></p>
                    </div>

                    <!-- the div for sign in -->

                    <div class="signin-btn">
                        <button class="google-btn"><img src="/images/google-logo.png" alt="Google" width="20">Sign in with Google</button>
                        <button class="apple-btn"><i class="bi bi-apple"></i>Sign in with Apple</button>
                    </div>

                    <p class="account">Have an account? <a href="#" class="sign-in">Sign in</a></p>
                </div>

            </form>
        
         </div>

         <!-- image div -->
         <div class="right-side">
            <img src="/images/Assignment image.jpeg" alt="A leaf">

         </div>


    
</body>
</html>
